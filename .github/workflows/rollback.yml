name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to rollback to (e.g. abc1234)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Re-tag rollback SHA as latest
        run: |
          SHA="${{ github.event.inputs.sha }}"
          docker pull ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper:sha-${SHA}
          docker tag  ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper:sha-${SHA} \
                      ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper:latest

          docker pull ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper-nginx:sha-${SHA}
          docker tag  ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper-nginx:sha-${SHA} \
                      ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper-nginx:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/marketplace-scraper-nginx:latest

      - name: Instructions
        run: |
          echo "Images re-tagged to :latest — run the following on your NAS to apply:"
          echo "  cd /volume1/docker/marketplace-scraper"
          echo "  docker compose pull && docker compose up -d"
