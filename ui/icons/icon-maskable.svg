<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (no rounded corners — maskable safe zone handles it) -->
  <rect width="192" height="192" fill="url(#bg)"/>

  <!-- Content scaled to fit maskable safe zone (~80% centered, inset ~19px each side) -->
  <!-- List rows -->
  <circle cx="60" cy="76" r="5" fill="#374151"/>
  <rect x="72" y="71" width="36" height="9" rx="4" fill="#374151"/>
  <circle cx="60" cy="96" r="5" fill="#374151"/>
  <rect x="72" y="91" width="28" height="9" rx="4" fill="#374151"/>
  <circle cx="60" cy="116" r="5" fill="#374151"/>
  <rect x="72" y="111" width="32" height="9" rx="4" fill="#374151"/>

  <!-- Magnifying glass -->
  <circle cx="118" cy="108" r="26" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <line x1="136" y1="126" x2="152" y2="142" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="110" cy="100" r="5" fill="#93c5fd" opacity="0.6"/>
</svg>
