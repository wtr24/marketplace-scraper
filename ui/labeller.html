<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleece Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #090b08;
  --surface:  #111410;
  --surface2: #181c15;
  --border:   #222b1c;
  --text:     #c8d6b4;
  --muted:    #4a5942;
  --faint:    #2a3224;
  --want:     #4c9044;
  --want-bg:  #162213;
  --no:       #944040;
  --no-bg:    #211111;
  --skip:     #2e3629;
  --skip-txt: #5a6b52;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow Condensed', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  /* Subtle noise texture */
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

#wrap {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── Header ─────────────────────────────────────────────── */

#header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

#count-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.04em;
}

#eta {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--faint);
  letter-spacing: 0.04em;
}

/* ── Progress bar ────────────────────────────────────────── */

#progress-track {
  height: 2px;
  background: var(--faint);
  margin-bottom: 14px;
  border-radius: 1px;
  overflow: hidden;
}

#progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #2d6a27, var(--want));
  border-radius: 1px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

/* ── Card deck ───────────────────────────────────────────── */

#deck {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  margin-bottom: 12px;
  border-radius: 14px;
}

.card {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  will-change: transform, opacity;
}

.card.back {
  transform: scale(0.94) translateY(14px);
  z-index: 0;
  transition: transform 0.38s cubic-bezier(0.34, 1.3, 0.64, 1);
}

.card.front {
  z-index: 1;
  transform: scale(1) translateY(0);
  transition: transform 0.38s cubic-bezier(0.34, 1.3, 0.64, 1);
  cursor: default;
}

/* Exit animations */
.card.exit-left {
  transform: translateX(-130%) rotate(-22deg) !important;
  opacity: 0 !important;
  transition: transform 0.28s cubic-bezier(0.4, 0, 1, 1),
              opacity 0.22s ease !important;
  pointer-events: none;
}

.card.exit-right {
  transform: translateX(130%) rotate(22deg) !important;
  opacity: 0 !important;
  transition: transform 0.28s cubic-bezier(0.4, 0, 1, 1),
              opacity 0.22s ease !important;
  pointer-events: none;
}

.card.exit-up {
  transform: translateY(-70%) scale(0.88) !important;
  opacity: 0 !important;
  transition: transform 0.24s ease-in,
              opacity 0.2s ease !important;
  pointer-events: none;
}

/* Back card promoting to front */
.card.promoting {
  transform: scale(1) translateY(0) !important;
  transition: transform 0.32s cubic-bezier(0.34, 1.45, 0.64, 1) !important;
}

/* Flash overlay inside each card */
.card-flash {
  position: absolute;
  inset: 0;
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease;
  border-radius: 14px;
}

.card.flash-want .card-flash  { background: rgba(76, 144, 68, 0.35); opacity: 1; }
.card.flash-no .card-flash    { background: rgba(148, 64, 64, 0.35); opacity: 1; }
.card.flash-skip .card-flash  { background: rgba(200, 214, 180, 0.12); opacity: 1; }

/* Card image */
.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Card gradient overlay + meta */
.card-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(5,7,4,0.95) 0%, rgba(5,7,4,0.6) 55%, transparent 100%);
  padding: 20px 16px 14px;
}

.card-title {
  font-family: 'Lora', serif;
  font-size: 0.95rem;
  line-height: 1.35;
  color: #e4ecd4;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Direction badges that appear on edge during swipe preview */
.card-badge {
  position: absolute;
  top: 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 4px;
  opacity: 0;
  transform: rotate(-12deg);
  pointer-events: none;
}

.card-badge.badge-want  { right: 16px; background: var(--want); color: #fff; transform: rotate(12deg); }
.card-badge.badge-no    { left: 16px;  background: var(--no);   color: #fff; transform: rotate(-12deg); }

/* Placeholder for empty/loading state */
.card-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface2);
}

.card-placeholder svg {
  opacity: 0.15;
}

/* ── Buttons ─────────────────────────────────────────────── */

#buttons {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.btn {
  border: none;
  border-radius: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 13px 0;
  position: relative;
  overflow: hidden;
  transition: transform 0.1s ease, filter 0.1s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.15s;
}

.btn:active::after { background: rgba(255,255,255,0.1); }

.btn.flash-active {
  transform: scale(0.95);
  filter: brightness(1.25);
}

#btn-no {
  background: var(--no-bg);
  color: var(--no);
  border: 1px solid color-mix(in srgb, var(--no) 30%, transparent);
}

#btn-yes {
  background: var(--want-bg);
  color: var(--want);
  border: 1px solid color-mix(in srgb, var(--want) 30%, transparent);
}

#btn-skip {
  background: var(--skip);
  color: var(--skip-txt);
  border: 1px solid var(--faint);
  font-size: 0.8rem;
  padding: 13px 18px;
}

.btn-key {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.08em;
  opacity: 0.45;
  margin-top: 2px;
  text-transform: none;
}

/* ── Hint ────────────────────────────────────────────────── */

#hint {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  color: var(--faint);
  text-align: center;
  letter-spacing: 0.05em;
}

/* ── Done screen ─────────────────────────────────────────── */

#done-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 40px 0;
  text-align: center;
}

#done-screen .done-icon {
  font-size: 2.5rem;
  line-height: 1;
}

#done-screen .done-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--want);
}

#done-screen .done-sub {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}

#labelling-ui { display: flex; flex-direction: column; gap: 0; }
</style>
</head>
<body>
<div id="wrap">

  <div id="header">
    <span id="count-label">— / — labelled</span>
    <span id="eta"></span>
  </div>

  <div id="progress-track">
    <div id="progress-fill"></div>
  </div>

  <div id="labelling-ui">
    <div id="deck">
      <!-- Card B (back) -->
      <div class="card back" id="card-b">
        <div class="card-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
          </svg>
        </div>
        <div class="card-flash"></div>
      </div>
      <!-- Card A (front) -->
      <div class="card front" id="card-a">
        <div class="card-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
          </svg>
        </div>
        <div class="card-badge badge-want">Want</div>
        <div class="card-badge badge-no">Pass</div>
        <div class="card-flash"></div>
      </div>
    </div>

    <div id="buttons">
      <button class="btn" id="btn-no"   onclick="label('dont_want')">
        ✕ Pass
        <span class="btn-key">J / ←</span>
      </button>
      <button class="btn" id="btn-skip" onclick="label('skip')">
        Skip
        <span class="btn-key">S</span>
      </button>
      <button class="btn" id="btn-yes"  onclick="label('want')">
        ✓ Want
        <span class="btn-key">L / →</span>
      </button>
    </div>

    <div id="hint">keyboard shortcuts active</div>
  </div>

  <div id="done-screen">
    <div class="done-icon">✓</div>
    <div class="done-title">All labelled</div>
    <div class="done-sub">run python -m classifier.train</div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let queue      = [];   // prefetched items (max 2 ahead)
let current    = null; // item currently shown on front card
let frontCard  = document.getElementById('card-a');
let backCard   = document.getElementById('card-b');
let isAnimating = false;
let labelled   = 0;
let total      = 0;
let startTime  = Date.now();
let labelledAtStart = 0;

// ── Fetch queue ────────────────────────────────────────────────────────────
async function prefetch() {
  if (queue.length >= 2) return;
  try {
    const resp = await fetch('/api/labeller/next');
    const data = await resp.json();
    if (data.done) {
      queue.push({ done: true });
      return;
    }
    // Preload image
    const img = new Image();
    img.src = data.image_url;
    queue.push({ ...data, _img: img });
    // Keep 2 ahead
    if (queue.length < 2) prefetch();
  } catch (e) {}
}

async function fetchProgress() {
  try {
    const resp = await fetch('/api/labeller/progress');
    const prog = await resp.json();
    labelled = prog.labelled;
    total    = prog.total;
    labelledAtStart = labelled;
    updateProgressUI();
  } catch (e) {}
}

// ── Render a card ──────────────────────────────────────────────────────────
function renderCard(el, item) {
  if (!item || item.done) return;
  el.innerHTML = `
    <img class="card-img" src="${item.image_url}" alt="">
    <div class="card-overlay">
      <div class="card-title">${item.title || 'Untitled'}</div>
      <div class="card-meta">${[item.site, item.size, item.condition, item.price ? '£'+item.price : null].filter(Boolean).join(' · ')}</div>
    </div>
    ${el === frontCard ? '<div class="card-badge badge-want">Want</div><div class="card-badge badge-no">Pass</div>' : ''}
    <div class="card-flash"></div>
  `;
}

// ── Show next from queue ───────────────────────────────────────────────────
function showNext() {
  if (queue.length === 0) return; // wait for prefetch
  const item = queue.shift();
  prefetch(); // keep queue topped up

  if (item.done) {
    showDone();
    return;
  }

  current = item;
  renderCard(frontCard, item);
}

function showDone() {
  document.getElementById('labelling-ui').style.display = 'none';
  document.getElementById('done-screen').style.display  = 'flex';
}

// ── Label action — INSTANT, no await ──────────────────────────────────────
function label(value) {
  if (!current || isAnimating) return;
  isAnimating = true;

  const itemId = current.id;
  const exitClass = value === 'want' ? 'exit-right' : value === 'dont_want' ? 'exit-left' : 'exit-up';
  const flashClass = value === 'want' ? 'flash-want' : value === 'dont_want' ? 'flash-no' : 'flash-skip';

  // 1. Flash the card
  frontCard.classList.add(flashClass);

  // 2. Flash the button
  const btnMap = { want: 'btn-yes', dont_want: 'btn-no', skip: 'btn-skip' };
  const btn = document.getElementById(btnMap[value]);
  btn.classList.add('flash-active');
  setTimeout(() => btn.classList.remove('flash-active'), 200);

  // 3. Promote back card immediately
  backCard.classList.remove('back');
  backCard.classList.add('front', 'promoting');

  // 4. Exit front card
  setTimeout(() => {
    frontCard.classList.add(exitClass);
  }, 30); // tiny delay so flash registers first

  // 5. Fire-and-forget POST (don't await)
  if (value !== 'skip') {
    fetch('/api/labeller/label', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listing_id: itemId, label: value })
    }).catch(() => {});
    labelled++;
    updateProgressUI();
  }

  // 6. After animation: swap cards, load next into old front
  setTimeout(() => {
    // Swap roles
    [frontCard, backCard] = [backCard, frontCard];

    // Reset old front (now back)
    backCard.className = 'card back';
    backCard.innerHTML = `
      <div class="card-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
        </svg>
      </div>
      <div class="card-flash"></div>
    `;

    // Clean front card classes
    frontCard.classList.remove('promoting');

    // Load next item
    if (queue.length === 0) {
      // Still fetching — wait a tick
      const poll = setInterval(() => {
        if (queue.length > 0) {
          clearInterval(poll);
          showNext();
          loadBackCard();
          isAnimating = false;
        }
      }, 50);
    } else {
      showNext();
      loadBackCard();
      isAnimating = false;
    }
  }, 320);
}

function loadBackCard() {
  // Populate back card with next queued item (without showing it)
  if (queue.length > 0 && !queue[0].done) {
    renderCard(backCard, queue[0]);
  }
}

// ── Progress UI ────────────────────────────────────────────────────────────
function updateProgressUI() {
  const pct = total > 0 ? (labelled / total * 100).toFixed(1) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('count-label').textContent =
    `${labelled} / ${total}`;

  const sessionLabelled = labelled - labelledAtStart;
  if (sessionLabelled > 0) {
    const elapsed = (Date.now() - startTime) / 1000;
    const rate = elapsed / sessionLabelled; // seconds per label
    const remaining = total - labelled;
    if (remaining > 0) {
      const etaSec = rate * remaining;
      const etaStr = etaSec < 60
        ? `${Math.round(etaSec)}s`
        : `${Math.round(etaSec / 60)}m`;
      document.getElementById('eta').textContent = `~${etaStr} left`;
    } else {
      document.getElementById('eta').textContent = '';
    }
  }
}

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft'  || e.key === 'j' || e.key === 'J') label('dont_want');
  if (e.key === 'ArrowRight' || e.key === 'l' || e.key === 'L') label('want');
  if (e.key === 's'          || e.key === 'S')                   label('skip');
});

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  await fetchProgress();
  // Prefetch first 2 items
  await prefetch();
  await prefetch();

  if (queue.length === 0 || queue[0].done) {
    showDone();
    return;
  }

  // Show first item on front card
  showNext();
  // Populate back card with second item
  loadBackCard();
}

init();
</script>
</body>
</html>
