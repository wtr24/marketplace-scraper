version: '3.8'

services:
  scraper:
    image: wtr24dev/marketplace-scraper:latest
    container_name: marketplace-scraper
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data          # SQLite database persistence
      - ./logs:/app/logs      # Application logs
    environment:
      - DATABASE_URL=sqlite:////data/scraper.db
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Europe/London
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    mem_limit: 2g             # Playwright is memory-hungry
    cpus: '2.0'
    shm_size: '256mb'         # Required for Chromium in Docker
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  watchtower:
    image: containrrr/watchtower
    command: --interval 30 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

