version: '3.8'

services:
  scraper:
    image: wtr24dev/marketplace-scraper:latest
    container_name: marketplace-scraper
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    expose:
      - "3000"           # internal only — nginx proxies to this
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:////data/scraper.db
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Europe/London
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    mem_limit: 2g
    cpus: '2.0'
    shm_size: '256mb'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: wtr24dev/marketplace-scraper-nginx:latest
    container_name: marketplace-scraper-nginx
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "3003:80"
    depends_on:
      - scraper
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    command: --interval 30 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

